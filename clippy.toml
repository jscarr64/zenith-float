# Clippy for zenith-float SoftFloat kernels.
#
# too-many-arguments-threshold: numeric kernels (ODE, SVD householders, roots,
# Airy, hypergeom) carry 8–13 matrices/coeff/state params. Grouping into structs
# would obscure the math and churn the public API for no correctness gain.
# Same rationale as Accumath workspace.

too-many-arguments-threshold = 13
max-fn-params-bools = 8
type-complexity-threshold = 300

# Portable integer code only. scripts/ci_no_intrinsics.sh is the text scan;
# these entries make `cargo clippy -D warnings` reject the same calls.
disallowed-macros = [
    { path = "core::arch::asm", reason = "no inline assembly in the numeric kernel" },
    { path = "core::arch::global_asm", reason = "no global assembly in the numeric kernel" },
    { path = "std::arch::asm", reason = "no inline assembly in the numeric kernel" },
    { path = "std::arch::global_asm", reason = "no global assembly in the numeric kernel" },
]
disallowed-methods = [
    { path = "core::arch::x86_64::_addcarry_u64", reason = "use overflowing add on Word", allow-invalid = true },
    { path = "core::arch::x86_64::_subborrow_u64", reason = "use overflowing sub on Word", allow-invalid = true },
    { path = "core::arch::x86::_addcarry_u32", reason = "use overflowing add on Word", allow-invalid = true },
    { path = "core::arch::x86::_subborrow_u32", reason = "use overflowing sub on Word", allow-invalid = true },
    { path = "core::arch::x86_64::_mm_add_epi32", reason = "use wrapping_add on u32 lanes", allow-invalid = true },
    { path = "core::arch::x86_64::_mm_add_epi64", reason = "use wrapping_add on u64 lanes", allow-invalid = true },
    { path = "core::arch::x86_64::_mm_mul_epu32", reason = "use a widening integer multiply", allow-invalid = true },
    { path = "core::arch::aarch64::vaddq_u32", reason = "use wrapping_add on u32 lanes", allow-invalid = true },
]
