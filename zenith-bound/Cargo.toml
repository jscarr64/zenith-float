[package]
name = "zenith-bound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Guaranteed-bounds (ball arithmetic) on zenith-float. Pre-release: nothing is guaranteed yet."
# Flipped to publishable only in the 2.0 release commit (zf 2.0 ships only when zb is complete through L4).
publish = false

[dependencies]
# Path dependency inside the zenith-float workspace (was git rev 627fedd). ExactNum lives in zenith-float-num.
# No std feature: zb does not need it. No other dependency is allowed. zenith-bound must never depend on zenith-float.
zenith-float-num = { path = "../zenith-float-num", version = "2.0.0", default-features = false }

# Applies to every target (lib, tests/, benches/, examples/): Jeff's rules hold in test code too.
[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
suspicious = { level = "deny", priority = -1 }
float_arithmetic = "deny"
float_cmp = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
