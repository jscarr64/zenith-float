[package]
name = "zenith-float-num"
version = "0.0.1"
edition = "2021"


[dev-dependencies]
rand = "0.8.5"
serde_json = "1.0.89"
zenith-float-macro = { version = "0.0.1", path = "../zenith-float-macro" }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dev-dependencies]
rug = { version = "~1.20.0", features = ["float", "rand"] }
gmp-mpfr-sys = { version = "~1.6.0", features = [] }

[dependencies]
serde = { version = "1.0.147", optional = true }
rand = { version = "0.8.5", optional = true }
lazy_static = { version = "1.4.0", default-features = false, features = [] }
itertools = { version = "0.10.3", default-features = false, features = [] }



[features]
default = ["std", "random", "serde"]
std = []
random = ["dep:rand"]
serde = ["dep:serde"]
# Optional MPFR golden tests (slow; enable with --features mpfr-tests).
mpfr-tests = []
