[package]
name = "zenith-float-num"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Software big-float kernel for zenith-float."
readme = "README.md"
keywords = ["arbitrary-precision", "bigfloat", "numeric", "no-std"]
categories = ["mathematics", "no-std", "science"]
# MPFR golden streams (tests/mpfr/golden, feature mpfr-tests; r6 item 6) stay in the repo, not in the published crate.
exclude = ["tests/mpfr/golden/", "tests/mpfr/golden-full/"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
rand = "0.8.5"
serde_json = "1.0.89"
# Test-only helpers (wall-clock budgets); path only, stripped on publish.
zenith-float-testkit = { path = "../zenith-float-testkit" }

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "transcendentals"
harness = false

[[bench]]
name = "composite"
harness = false

[[bench]]
name = "specials"
harness = false

[[bench]]
name = "linalg"
harness = false

[[test]]
name = "radix_roundtrip"
required-features = ["random"]

[[test]]
name = "integration_tests"
required-features = ["mpfr-tests"]

[dependencies]
serde = { version = "1.0.147", optional = true }
rand = { version = "0.8.5", optional = true }
itertools = { version = "0.10.3", default-features = false, features = [] }

[features]
default = ["std"]
std = []
random = ["dep:rand", "std"]
serde = ["dep:serde", "std"]
# MPFR comparison tests against committed python-flint goldens (tests/mpfr/golden, see tools/mpfr_golden).
mpfr-tests = ["random"]
# Regenerates the goldens: the tests send each query to tools/mpfr_golden/gen.py (run tools/mpfr_golden/gen.sh).
mpfr-golden-gen = ["mpfr-tests"]
