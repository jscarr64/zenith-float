# Design artifact (Harper pmrev12 A2, TD40): cross-OS gold check on macOS arm64 and native Windows. NOT enabled: the trigger is
# workflow_dispatch only, and turning it on as CI needs Jeff's go in his own words. aarch64-apple-darwin and
# x86_64-pc-windows-msvc stay pending-CI in docs/test-plan/inputs/targets.csv.
# Each job runs the committed-gold test binaries (each asserts bit-exact equality with zenith-float-num/tests/oracle/goldens)
# with the pinned toolchain 1.99 (rust-toolchain.toml) and no MPFR, then the trybuild macro_compile_tests natively (ZF-T02(b)
# on a real host; on Pop it runs through the docs/test-plan/tools/t02b wrapper under wine), and uploads a verdict TSV.
name: cross-os-golds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golds:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99'
      - name: Check toolchain pin
        run: |
          grep -q 'channel = "1.99"' rust-toolchain.toml
          rustc --version
      - name: Run committed-gold binaries (bit for bit, no MPFR) and trybuild
        run: |
          set -o pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          : > verdicts.tsv
          rc=0
          for t in r9_overflow_golds r13_div_hypot_golds borrow_ops_golds s9_specials_golds; do
            cargo test --locked --release -p zenith-float-num --no-default-features --features std --test "$t" -- --test-threads=1 2>&1 | tee "$t.out" || rc=1
            awk -v t="$t" -v h="$host" '/^test .* \.\.\. (ok|FAILED)$/ { v = ($NF == "ok") ? "PASS" : "FAIL"; print t "::" $2 "\t" v "\t" h }' "$t.out" >> verdicts.tsv
          done
          cargo test --locked -p zenith-float --test mod macro_compile_tests -- --test-threads=1 2>&1 | tee trybuild.out || rc=1
          awk -v h="$host" '/^test .* \.\.\. (ok|FAILED)$/ { v = ($NF == "ok") ? "PASS" : "FAIL"; print "trybuild::" $2 "\t" v "\t" h }' trybuild.out >> verdicts.tsv
          cat verdicts.tsv
          exit $rc
      - name: Upload verdict TSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-golds-verdicts-${{ matrix.os }}
          path: verdicts.tsv
