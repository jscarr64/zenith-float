[workspace]
members = [
    "zenith-float-num",
    "zenith-float-macro",
    "zenith-float-compare",
]
resolver = "2"

[workspace.metadata.rust-analyzer]
cargo.allFeatures = true

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jeffrey S Carr <jeff@mcgeeresources.com>"]
license = "MIT OR Apache-2.0"
repository = "https://origin.cursor.com/jscarr/zenith-float"

[package]
name = "zenith-float"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Arbitrary-precision software floating-point arithmetic on integer limbs."
readme = "README.md"
exclude = [
    "doc/BUILD_CHECKLIST.md",
    "doc/Additions_to_existing_29-082026.md",
    "doc/zenith-float.code-workspace",
]
keywords = ["arbitrary-precision", "bigfloat", "numeric", "no-std"]
categories = ["mathematics", "no-std", "science"]

[dependencies]
zenith-float-num = { path = "zenith-float-num", version = "0.1.0", default-features = false }
zenith-float-macro = { path = "zenith-float-macro", version = "0.1.0" }

[features]
default = ["std"]
std = ["zenith-float-num/std"]
random = ["zenith-float-num/random"]
serde = ["std", "zenith-float-num/serde"]
# Optional MPFR golden tests (Linux x86_64; enable with --features mpfr-tests).
mpfr-tests = ["zenith-float-num/mpfr-tests"]

[dev-dependencies]
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
