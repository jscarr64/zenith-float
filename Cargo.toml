[workspace]
members = [
    "zenith-float-num",
    "zenith-float-macro",
    "zenith-float-compare",
]
exclude = ["nostd-tests"]
resolver = "2"

[workspace.package]
version = "1.0.13"
edition = "2021"
authors = ["Jeffrey S Carr <jscarr1964@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jscarr64/zenith-float"
homepage = "https://github.com/jscarr64/zenith-float"

[package]
name = "zenith-float"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Arbitrary-precision software floating-point arithmetic on integer limbs."
readme = "README.md"
documentation = "https://docs.rs/zenith-float"
exclude = [
    "zenith-float-num",
    "zenith-float-macro",
    "zenith-float-compare",
    "scripts",
    "golds",
    "nostd-tests",
    "doc/bench-baselines.tsv",
    "doc/compare-results.tsv",
]
keywords = ["arbitrary-precision", "bigfloat", "numeric", "no-std"]
categories = ["mathematics", "no-std", "science"]

[dependencies]
zenith-float-num = { path = "zenith-float-num", version = "1.0.13", default-features = false }
zenith-float-macro = { path = "zenith-float-macro", version = "1.0.13" }

[features]
default = ["std"]
std = ["zenith-float-num/std"]
random = ["zenith-float-num/random"]
serde = ["std", "zenith-float-num/serde"]
# Optional MPFR golden tests (Linux x86_64; enable with --features mpfr-tests).
mpfr-tests = ["zenith-float-num/mpfr-tests"]

# `hex_golds` prints with `std` (and `?` converts `zenith_float::Error` into `Box<dyn Error>`, which needs the `std`
# feature): it is built for the hex-limb CI hosts (default features), not for `--no-default-features` or bare-metal targets.
[[bin]]
name = "hex_golds"
path = "src/bin/hex_golds.rs"
required-features = ["std"]

[dev-dependencies]
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
