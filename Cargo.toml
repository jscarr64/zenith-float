[workspace]
members = [
    "zenith-float-num",
    "zenith-float-macro",
    "zenith-float-compare",
    "zenith-float-bound",
]
exclude = ["nostd-tests"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.99"
authors = ["Jeffrey S Carr <jscarr1964@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jscarr64/zenith-float"
homepage = "https://github.com/jscarr64/zenith-float"

[package]
name = "zenith-float"
version.workspace = true
edition.workspace = true
rust-version = "1.99"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Arbitrary-precision software floating-point arithmetic on integer limbs."
readme = "README.md"
documentation = "https://docs.rs/zenith-float"
exclude = [
    "zenith-float-num",
    "zenith-float-macro",
    "zenith-float-compare",
    "zenith-float-bound",
    "scripts",
    "golds",
    "nostd-tests",
    "doc/bench-baselines.tsv",
    "doc/compare-results.tsv",
]
keywords = ["arbitrary-precision", "bigfloat", "numeric", "no-std"]
categories = ["mathematics", "no-std", "science"]

[dependencies]
zenith-float-num = { path = "zenith-float-num", version = "2.0.0", default-features = false }
zenith-float-macro = { path = "zenith-float-macro", version = "2.0.0" }
# Bound layer (ball arithmetic), part of this library; path only, re-exported as `zenith_float::bound`.
zenith-float-bound = { path = "zenith-float-bound", optional = true }

# hex_golds prints golds with std I/O; a --no-default-features build skips it.
[[bin]]
name = "hex_golds"
path = "src/bin/hex_golds.rs"
required-features = ["std"]

[features]
default = ["std", "bound"]
std = ["zenith-float-num/std"]
# The bound layer needs std today (it is not no_std); --no-default-features leaves it out.
bound = ["std", "dep:zenith-float-bound"]
random = ["zenith-float-num/random"]
serde = ["std", "zenith-float-num/serde"]
# Optional MPFR golden tests (Linux x86_64; enable with --features mpfr-tests).
mpfr-tests = ["zenith-float-num/mpfr-tests"]

[dev-dependencies]
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
